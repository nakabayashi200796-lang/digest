<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FAF7F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="The Brief">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>The Brief 11/14（土）</title>
<style>
/* The Brief（毎日のニュース）。2026-11-14 kyo と決めた形: Economist Espresso 風の番号つき一覧・いつも明るい配色・本文は横にすべらせて次へ。
   名前とアイコンは同日 kyo が選んだ（The Brief・紙色に Bodoni の文字）。出どころを強調し、いつも見えるスクロールバーを付けた */
:root{
  --paper:#FAF7F2; --card:#FFFFFF; --ink:#1B1A18; --sub:#77716A; --rule:#E3DCD0; --soft:#F1ECE3;
  --accent:#C8331F; --up:#1E7A3C; --down:#BF3A2E;
  --display:"Bodoni Moda","Bodoni 72","Didot",Georgia,serif;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;touch-action:manipulation;background:var(--paper);scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;overscroll-behavior-y:none}
button{font-family:inherit}
.wrap{max-width:620px;margin:0 auto;padding:0 18px calc(40px + env(safe-area-inset-bottom))}

/* 見出し */
header{padding:calc(30px + env(safe-area-inset-top)) 0 0;text-align:center}
.date{font-size:11px;letter-spacing:.2em;color:var(--sub);font-weight:700}
h1{font-family:var(--display);font-size:52px;font-weight:700;line-height:1.05;margin:8px 0 12px;letter-spacing:-.01em}
h1 .the{font-style:italic;font-weight:500;font-size:.62em;margin-right:.12em;vertical-align:.08em}
.meta{display:flex;justify-content:center;gap:10px;font-size:11px;letter-spacing:.2em;font-weight:700;color:var(--ink);
  border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);padding:7px 0;margin:0}
.meta .dot{color:var(--accent)}

/* マーケット */
.mhead{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 8px;font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--ink)}
.mhead small{font-weight:400;letter-spacing:0;font-size:11px}
.market{display:flex;overflow-x:auto;margin:0 -18px;padding:0 18px 14px;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.market::-webkit-scrollbar{display:none}
.mk{flex:none;width:118px;padding:0 12px 0 0;margin-right:12px;border-right:1px solid var(--rule);cursor:pointer}
.mk:last-child{border-right:0}
.mk:active{opacity:.6}
.mk b{display:block;font-size:11px;color:var(--sub);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk span{display:block;font-size:15px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.mk i{display:block;font-style:normal;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.mk svg{display:block;width:100%;height:24px;margin-top:4px}
.up{color:var(--up)}.down{color:var(--down)}

/* 一覧 */
.item{display:grid;grid-template-columns:34px minmax(0,1fr);padding:18px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.item:active{background:var(--soft)}
.item .num{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--accent);line-height:1.5}
/* 出どころ（どこの記事か）を目立たせる: サイトの色の四角＋太字の名前、その後ろに分野と時刻 */
.src{display:flex;align-items:center;flex-wrap:wrap;gap:0 7px;font-size:12.5px;font-weight:800;letter-spacing:.03em;color:var(--ink);margin-bottom:4px;line-height:1.5}
.src .sq{width:9px;height:9px;flex:none;border-radius:1px}
.src .cat{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.04em;padding-left:7px;border-left:1px solid var(--rule)}
.src .tm{font-size:11px;font-weight:500;color:var(--sub);letter-spacing:0}
.item h2{font-family:var(--serif);font-size:18.5px;line-height:1.5;margin:0 0 5px;font-weight:700}
.item p{font-size:13.5px;color:#4A4640;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item.read .num{color:var(--sub)}
.item.read h2,.item.read p{color:var(--sub)}
.end{text-align:center;padding:30px 0 4px;font-family:var(--display);font-style:italic;font-weight:500;color:var(--ink);font-size:21px}
.end::before{content:"";display:block;width:28px;height:2px;background:var(--accent);margin:0 auto 14px}
.next-time{text-align:center;font-size:12px;color:var(--sub);margin:4px 0 22px}
footer{text-align:center;font-size:12px;color:var(--sub);display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
footer a,footer button{color:var(--sub);background:none;border:0;font-size:12px;padding:6px 0;text-decoration:underline}
.msg{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:18px;margin-top:22px;font-size:15px}
.msg input{width:100%;font-size:16px;padding:10px;border:1px solid var(--rule);border-radius:8px;margin:10px 0}
.msg button{font-size:15px;padding:10px 16px;border:0;border-radius:8px;background:var(--ink);color:#fff}

/* 本文（横にすべらせて次の記事へ） */
#reader{position:fixed;inset:0;background:var(--paper);z-index:10;display:none;flex-direction:column}
#reader.on{display:flex}
.bar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid var(--rule);background:var(--paper)}
.bar button{border:0;background:none;font-size:15px;color:var(--accent);font-weight:700;padding:8px 6px;min-width:64px;text-align:left}
.bar .pos{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:5px;min-width:64px;justify-content:flex-end;padding-right:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--rule)}
.dots i.on{background:var(--accent)}
.pages{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;width:100%;height:100%;overflow-y:auto;overscroll-behavior-y:contain;scroll-snap-align:start;scroll-snap-stop:always;-webkit-overflow-scrolling:touch}
.art{max-width:620px;margin:0 auto;padding:18px 20px calc(48px + env(safe-area-inset-bottom))}
.art .src{font-size:14.5px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.art .src .sq{width:11px;height:11px}
.art .src .tm{margin-left:auto}
.art h2{font-family:var(--serif);font-size:23px;line-height:1.5;margin:6px 0 14px;font-weight:700}
.art .hero{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:4px;background:var(--soft);margin-bottom:16px}
.art .body p{font-size:17px;line-height:1.9;margin:0 0 1.05em;letter-spacing:.01em}
.note{font-size:14px;color:var(--sub);border-left:3px solid var(--rule);padding:4px 0 4px 12px;margin:6px 0 16px}
.btn{display:block;text-align:center;border:1.5px solid var(--ink);color:var(--ink);text-decoration:none;border-radius:999px;padding:11px;font-weight:700;font-size:14px;margin:22px 0 8px}
.rel{margin-top:22px}
.rel h3{font-size:12px;color:var(--sub);letter-spacing:.08em;margin:0 0 4px;font-weight:700}
.rel a{display:block;color:var(--ink);text-decoration:none;font-size:14.5px;padding:9px 0;border-bottom:1px solid var(--rule)}
.rel a small{display:block;color:var(--sub);font-size:12px}
.nextbtn{display:block;width:100%;border:0;border-top:2px solid var(--ink);background:none;padding:14px 0 0;margin-top:28px;font-size:15px;color:var(--ink);text-align:left;font-family:var(--serif);font-weight:700;line-height:1.5}
.nextbtn small{display:block;font-family:var(--sans);color:var(--accent);font-size:12px;font-weight:700;margin-bottom:2px}
.fin{text-align:center;margin-top:34px}
.fin .end{padding-top:0}
.fin button{margin-top:10px;border:1.5px solid var(--ink);background:none;border-radius:999px;padding:10px 22px;font-size:14px;font-weight:700;color:var(--ink)}

/* 市場のグラフ（下から出る） */
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.on{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(27,26,24,.35)}
#sheet .pane{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:16px 16px 0 0;padding:16px 18px;padding-bottom:max(18px,env(safe-area-inset-bottom));max-width:620px;margin:0 auto}
#sheet .top{display:flex;justify-content:space-between;align-items:flex-start}
#sheet h3{margin:0;font-size:13px;color:var(--sub)}
#sheet .val{font-size:26px;font-weight:800;margin:2px 0;font-variant-numeric:tabular-nums}
#sheet .pane i{font-style:normal;font-size:13px;font-weight:600}
#sheet .close{border:0;background:var(--soft);border-radius:50%;width:34px;height:34px;font-size:15px;color:var(--sub)}
#sheet .tabs{display:flex;gap:6px;margin:12px 0 6px}
#sheet .tabs button{border:1px solid var(--rule);background:none;border-radius:16px;padding:4px 12px;font-size:13px;color:var(--ink)}
#sheet .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#sheet svg{display:block;width:100%;height:180px}
#sheet .axis{display:flex;justify-content:space-between;font-size:11px;color:var(--sub)}
#sheet .stat{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;margin-top:10px;color:var(--sub)}
#sheet .stat b{color:var(--ink)}
/* いつも見えるスクロールバー（つまんで動かせる。iPhone は普段出ないので自前で描く） */
.sb{position:fixed;right:0;top:0;bottom:0;width:24px;z-index:15;pointer-events:none}
.sb[hidden]{display:none}
.sb .tr{position:absolute;right:3px;top:10px;bottom:10px;width:6px;border-radius:3px;background:rgba(27,26,24,.08)}
.sb .th{position:absolute;right:0;width:28px;pointer-events:auto;touch-action:none;cursor:grab}
.sb .th::after{content:"";position:absolute;right:3px;top:0;bottom:0;width:6px;border-radius:3px;background:rgba(27,26,24,.42);transition:width .15s,background .15s}
.sb .th.drag::after{width:9px;background:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:8px 14px;border-radius:999px;z-index:30}
</style>
</head>

  if (m) { save(m[1]); history.replaceState(null, "", location.pathname); }
  var key = m ? m[1] : null;
  if (!key) { try { key = localStorage.getItem(KEY_NAME); } catch (e) {} }
  var standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;

  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function b64(s){ s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function toast(t){ var d = el("div", "toast", t); document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 2200); }

  // ホーム画面のアプリ（iPhone）は Chrome と保存場所が別なので、Chrome 側で鍵をコピーしてアプリに貼る
  var ck = document.getElementById("copykey");
  if (key && !standalone && /iPhone|iPad/.test(navigator.userAgent)) {
    ck.style.display = "";
    ck.onclick = function(){ navigator.clipboard.writeText(key).then(function(){ toast("コピーしました。ホーム画面のアプリで貼ってください"); }); };
  }
  function askKey(t){
    var box = el("div", "msg"); box.appendChild(el("div", null, t));
    var inp = el("input"); inp.placeholder = "鍵を貼る"; inp.autocomplete = "off"; box.appendChild(inp);
    var ok = el("button", null, "開く"); ok.onclick = function(){ var v = inp.value.trim(); if (v) { save(v); location.reload(); } };
    box.appendChild(ok); document.getElementById("list").appendChild(box);
  }

  if (P.plain) { show(P.plain); return; }
  if (!key) {
    askKey(standalone ? "最初に一度だけ鍵を入れてください。ntfy の通知から Chrome でこのページを開き、いちばん下の「アプリ用の鍵をコピー」を押してから、ここに貼ります。"
                      : "このページを読むための鍵がこの端末にありません。スマホの ntfy の通知から一度開くと、次からはここからも読めます。");
    return;
  }
  var raw = b64(P.enc);
  crypto.subtle.importKey("raw", b64(key), "AES-GCM", false, ["decrypt"])
    .then(function(k){ return crypto.subtle.decrypt({name: "AES-GCM", iv: raw.slice(0, 12)}, k, raw.slice(12)); })
    .then(function(buf){ show(JSON.parse(new TextDecoder().decode(buf))); })
    .catch(function(){ askKey("鍵が合わず開けませんでした。ntfy の新しい通知から開き直すか、正しい鍵を貼ってください。"); });

  function show(D){
    var items = D.items, readKey = "dailynews_read_" + D.date, read = {};
    try { read = JSON.parse(localStorage.getItem(readKey) || "{}"); } catch (e) {}
    var chars = 0; items.forEach(function(it){ chars += (it.body ? it.body.join("") : it.desc).length; });
    var d = D.date.split("-"), dt = new Date(+d[0], +d[1] - 1, +d[2]);
    var DAYS = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
    var MONTHS = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
    document.getElementById("date").textContent = DAYS[dt.getDay()] + ", " + MONTHS[dt.getMonth()] + " " + dt.getDate() + ", " + dt.getFullYear();
    var meta = document.getElementById("meta"); meta.style.display = "";
    [items.length + " STORIES", "·", Math.max(1, Math.round(chars / 500)) + " MIN READ"].forEach(function(t){ meta.appendChild(el("span", t === "·" ? "dot" : null, t)); });

    // ---- マーケット ----
    var mk = document.getElementById("market");
    if (D.market && D.market.length) { var mh = document.getElementById("mhead"); mh.style.display = ""; mh.lastChild.textContent = D.market[0].as_of + " の終値・押すとグラフ"; }
    (D.market || []).forEach(function(r){
      var c = el("div", "mk"); c.appendChild(el("b", null, r.name));
      c.appendChild(el("span", null, r.value)); c.appendChild(el("i", r.change[0] === "-" ? "down" : "up", r.change));
      if (r.series) { c.appendChild(chart(r.series.slice(-22), 106, 24, false)); c.onclick = function(){ sheet(r, 22); }; }
      mk.appendChild(c);
    });

    // ---- 一覧 ----
    var list = document.getElementById("list");
    // どこの記事かを目立たせる: サイトごとの色の四角＋太字の名前（一覧は短い名前、本文は正式な名前）
    var SITES = [[/^BBC/, "BBC", "#1B1A18"], [/^NHK/, "NHK", "#1F5FAE"], [/^日テレ/, "日テレNEWS", "#D49B00"], [/^CNN/, "CNN", "#CC0000"],
                 [/^Business Insider/, "Business Insider", "#3D3BD6"], [/^ロイター/, "ロイター", "#F07800"], [/^ITmedia/, "ITmedia", "#0A8A8A"],
                 [/^ケータイ/, "ケータイ Watch", "#2E8B3E"], [/^Security/, "Security NEXT", "#7B3FA0"], [/^IPA/, "IPA", "#2B3A67"], [/^JPCERT/, "JPCERT/CC", "#4C6A85"]];
    function site(name){ for (var k = 0; k < SITES.length; k++) if (SITES[k][0].test(name)) return SITES[k]; return [null, name, "#77716A"]; }
    function lab(it, box, full){
      var s = site(it.source), l = el("div", "src"), sq = el("i", "sq"); sq.style.background = s[2];
      l.appendChild(sq); l.appendChild(el("span", null, full ? it.source : s[1]));
      if (it.label) l.appendChild(el("span", "cat", it.label));
      l.appendChild(el("span", "tm", full ? it.time : it.time.slice(6))); box.appendChild(l);
    }
    items.forEach(function(it, i){
      var c = el("div", "item" + (read[i] ? " read" : ""));
      c.appendChild(el("div", "num", read[i] ? "✓" : String(i + 1).padStart(2, "0")));
      var t = el("div"); lab(it, t, false); t.appendChild(el("h2", null, it.title)); if (it.desc) t.appendChild(el("p", null, it.desc));
      c.appendChild(t); c.onclick = function(){ open(i); };
      it._card = c; list.appendChild(c);
    });
    document.getElementById("tail").style.display = "";

    // ---- 本文（全部の記事を横に並べ、すべらせて次へ） ----
    var reader = document.getElementById("reader"), pages = document.getElementById("pages");
    var pos = document.getElementById("pos"), dots = document.getElementById("dots"), cur = -1;
    items.forEach(function(it, i){
      var pg = el("div", "page"), a = el("div", "art");
      lab(it, a, true);
      a.appendChild(el("h2", null, it.title));
      if (it.img) { var im = el("img", "hero"); im.dataset.src = it.img; im.referrerPolicy = "no-referrer"; im.alt = ""; im.onerror = function(){ this.remove(); }; a.appendChild(im); }
      var body = el("div", "body");
      if (it.body) it.body.forEach(function(p){ body.appendChild(el("p", null, p)); });
      else if (it.desc) body.appendChild(el("p", null, it.desc));
      a.appendChild(body);
      if (!it.body) a.appendChild(el("div", "note", "このサイトは本文を取り込めないので、続きは元の記事でお読みください。"));
      var btn = el("a", "btn", it.source + " で元の記事を開く"); btn.href = it.url; btn.target = "_blank"; btn.rel = "noopener noreferrer"; a.appendChild(btn);
      if (it.related && it.related.length) {
        var r = el("div", "rel"); r.appendChild(el("h3", null, "同じ話題のほかの報道"));
        it.related.forEach(function(x){ var l = el("a", null, x.title); l.href = x.url; l.target = "_blank"; l.rel = "noopener noreferrer"; l.appendChild(el("small", null, x.source)); r.appendChild(l); });
        a.appendChild(r);
      }
      if (i + 1 < items.length) {
        var n = el("button", "nextbtn"); n.appendChild(el("small", null, "次の記事 →")); n.appendChild(document.createTextNode(items[i + 1].title));
        n.onclick = function(){ go(i + 1, true); }; a.appendChild(n);
      } else {
        var f = el("div", "fin"); f.appendChild(el("div", "end", "That’s all for today."));
        var bk = el("button", null, "一覧に戻る"); bk.onclick = function(){ history.back(); }; f.appendChild(bk); a.appendChild(f);
      }
      pg.appendChild(a); pages.appendChild(pg);
      dots.appendChild(el("i"));
    });
    function mark(i){
      if (i === cur || i < 0 || i >= items.length) return;
      cur = i; pos.textContent = (i + 1) + " / " + items.length;
      Array.prototype.forEach.call(dots.children, function(x, j){ x.className = j === i ? "on" : ""; });
      [i - 1, i, i + 1].forEach(function(j){ var im = pages.children[j] && pages.children[j].querySelector("img[data-src]"); if (im) { im.src = im.dataset.src; im.removeAttribute("data-src"); } });
      read[i] = 1; items[i]._card.classList.add("read"); items[i]._card.firstChild.textContent = "✓";
      try { localStorage.setItem(readKey, JSON.stringify(read)); } catch (e) {}
      upd2();
    }
    function go(i, smooth){ pages.scrollTo({left: i * pages.clientWidth, behavior: smooth ? "smooth" : "auto"}); if (!smooth) mark(i); }
    var t = null;
    pages.addEventListener("scroll", function(){ clearTimeout(t); t = setTimeout(function(){ mark(Math.round(pages.scrollLeft / pages.clientWidth)); }, 80); }, {passive: true});
    window.addEventListener("resize", function(){ if (reader.classList.contains("on")) go(cur, false); });
    function open(i){
      reader.classList.add("on"); document.body.style.overflow = "hidden";
      pages.children[i].scrollTop = 0; cur = -1; go(i, false);
      history.pushState({reader: 1}, ""); upd1(); upd2();
    }
    document.getElementById("back").onclick = function(){ history.back(); };
    window.addEventListener("popstate", function(e){
      if (!(e.state && e.state.reader)) { reader.classList.remove("on"); document.body.style.overflow = ""; upd1(); }
    });

    // ---- いつも見えるスクロールバー（つまみを指で動かすと、その位置まで飛ぶ） ----
    function scrollbar(bar, getEl, topOf){
      var th = bar.querySelector(".th"), drag = null;
      function m(){
        var e = getEl(); if (!e) return null;
        var win = e === document.scrollingElement;
        return {e: e, win: win, view: win ? window.innerHeight : e.clientHeight, full: e.scrollHeight, top: win ? window.scrollY : e.scrollTop};
      }
      function update(){
        var s = m();
        if (!s || s.full <= s.view + 4) { bar.hidden = true; return; }
        bar.hidden = false; bar.style.top = topOf() + "px";
        var track = bar.clientHeight - 20, h = Math.max(40, track * s.view / s.full);
        th.style.height = h + "px"; th.style.top = (10 + (track - h) * Math.min(1, s.top / (s.full - s.view))) + "px";
        return {s: s, track: track, h: h};
      }
      th.addEventListener("pointerdown", function(ev){
        var u = update(); if (!u) return;
        drag = {y: ev.clientY, top: u.s.top, rate: (u.s.full - u.s.view) / Math.max(1, u.track - u.h)};
        th.classList.add("drag"); th.setPointerCapture(ev.pointerId); ev.preventDefault();
      });
      th.addEventListener("pointermove", function(ev){
        if (!drag) return; var s = m(), y = drag.top + (ev.clientY - drag.y) * drag.rate;
        if (s.win) window.scrollTo(0, y); else s.e.scrollTop = y;
      });
      ["pointerup", "pointercancel"].forEach(function(t){ th.addEventListener(t, function(){ drag = null; th.classList.remove("drag"); }); });
      return update;
    }
    var sb1 = document.getElementById("sb"), sb2 = document.getElementById("sb2");
    var upd1 = scrollbar(sb1, function(){ return reader.classList.contains("on") ? null : document.scrollingElement; }, function(){ return 0; });
    var upd2 = scrollbar(sb2, function(){ return reader.classList.contains("on") ? pages.children[cur] : null; },
                         function(){ return reader.querySelector(".bar").offsetHeight; });
    window.addEventListener("scroll", upd1, {passive: true});
    pages.addEventListener("scroll", upd2, {passive: true, capture: true});   // 各記事の縦のスクロールも拾う
    window.addEventListener("resize", function(){ upd1(); upd2(); });
    window.addEventListener("load", upd1);
    upd1();

    // ---- 市場のグラフ（小さいカードは1か月、押すと1か月／3か月） ----
    function chart(pts, w, h, big){
      var NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg");
      svg.setAttribute("viewBox", "0 0 " + w + " " + h); svg.setAttribute("preserveAspectRatio", "none");
      var v = pts.map(function(p){ return p[1]; }), lo = Math.min.apply(null, v), hi = Math.max.apply(null, v), pad = big ? 8 : 2;
      var xy = v.map(function(y, i){ return [(i / Math.max(1, v.length - 1)) * w, pad + (hi === lo ? 0.5 : (hi - y) / (hi - lo)) * (h - pad * 2)]; });
      var pts2 = xy.map(function(p){ return p[0].toFixed(1) + "," + p[1].toFixed(1); });
      var col = v[v.length - 1] >= v[0] ? "#1E7A3C" : "#BF3A2E";
      if (big) { var area = document.createElementNS(NS, "path");
        area.setAttribute("d", "M0," + h + " L" + pts2.join(" L") + " L" + w + "," + h + " Z");
        area.setAttribute("fill", col); area.setAttribute("fill-opacity", ".08"); svg.appendChild(area); }
      var line = document.createElementNS(NS, "polyline");
      line.setAttribute("points", pts2.join(" "));
      line.setAttribute("fill", "none"); line.setAttribute("stroke", col); line.setAttribute("stroke-width", big ? 2 : 1.5);
      line.setAttribute("vector-effect", "non-scaling-stroke"); line.setAttribute("stroke-linejoin", "round"); svg.appendChild(line);
      return svg;
    }
    function fmtv(r, x){
      if (r.fmt === "man") return Math.round(x / 10000).toLocaleString() + "万円";
      var dec = +(r.fmt.match(/\.(\d)f/) || [0, 0])[1], unit = r.fmt.split("}")[1] || "";
      return x.toLocaleString("ja-JP", {minimumFractionDigits: dec, maximumFractionDigits: dec}) + unit;
    }
    var sh = document.getElementById("sheet"), pane = document.getElementById("pane");
    sh.querySelector(".bg").onclick = function(){ sh.classList.remove("on"); };
    function sheet(r, n){
      var pts = r.series.slice(-n), v = pts.map(function(p){ return p[1]; });
      var first = v[0], last = v[v.length - 1];
      var diff = r.how === "pt" ? (last - first >= 0 ? "+" : "") + (last - first).toFixed(2) + "pt"
                                : (last >= first ? "+" : "") + ((last - first) / first * 100).toFixed(2) + "%";
      pane.innerHTML = "";
      var top = el("div", "top"), l = el("div"); l.appendChild(el("h3", null, r.group + "・" + r.name));
      l.appendChild(el("div", "val", r.value)); l.appendChild(el("i", r.change[0] === "-" ? "down" : "up", "前日比 " + r.change + "（" + r.as_of + "）"));
      var x = el("button", "close", "✕"); x.onclick = function(){ sh.classList.remove("on"); };
      top.appendChild(l); top.appendChild(x); pane.appendChild(top);
      var tabs = el("div", "tabs");
      [["1か月", 22], ["3か月", 66]].forEach(function(t){
        var b = el("button", n === t[1] ? "on" : null, t[0]); b.onclick = function(){ sheet(r, t[1]); }; tabs.appendChild(b); });
      pane.appendChild(tabs);
      pane.appendChild(chart(pts, 300, 180, true));
      var ax = el("div", "axis"); ax.appendChild(el("span", null, pts[0][0])); ax.appendChild(el("span", null, pts[pts.length - 1][0])); pane.appendChild(ax);
      var st = el("div", "stat");
      [["この期間 ", diff], ["高値 ", fmtv(r, Math.max.apply(null, v))], ["安値 ", fmtv(r, Math.min.apply(null, v))]].forEach(function(a){
        var s = el("span", null, a[0]); s.appendChild(el("b", null, a[1])); st.appendChild(s); });
      pane.appendChild(st); sh.classList.add("on");
    }
  }
})();
</script>
</body>
</html>
