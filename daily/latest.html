<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>毎日のニュース 11/14（土）</title>
<style>
:root{--bg:#F4F2EE;--card:#FFFFFF;--ink:#16181D;--sub:#6B6F78;--line:#E6E2DA;--accent:#C2410C;--chip:#EFEBE4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
header{padding:22px 2px 10px}
.kicker{font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:700}
h1{font-size:26px;margin:2px 0 2px;letter-spacing:.02em}
.meta{font-size:13px;color:var(--sub)}
.market{display:flex;gap:8px;margin:12px 0 6px;overflow-x:auto}
.mk{flex:1;min-width:96px;background:var(--card);border-radius:12px;padding:8px 10px}
.mk b{display:block;font-size:11px;color:var(--sub);font-weight:600}
.mk span{font-size:15px;font-weight:700}
.mk i{display:block;font-style:normal;font-size:12px;font-weight:600}
.up{color:#15803D}.down{color:#B91C1C}
.list{margin-top:10px}
.card{display:flex;gap:12px;background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}
.card:active{opacity:.7}
.card.read{opacity:.55}
.card .no{font-size:13px;font-weight:800;color:var(--accent);min-width:16px}
.card .txt{flex:1;min-width:0}
.card h2{font-size:16.5px;line-height:1.45;margin:0 0 4px}
.card p{font-size:13.5px;color:#3E424A;margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .src{font-size:12px;color:var(--sub)}
.card img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:none;background:var(--chip)}
.chip{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:#FBEADF;border-radius:6px;padding:0 6px;margin-right:6px}
#view{position:fixed;inset:0;background:var(--card);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;z-index:10}
#view.on{display:block}
.bar{position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
.bar button{border:0;background:none;font-size:15px;color:var(--accent);font-weight:700;padding:6px 4px}
.bar .pos{font-size:13px;color:var(--sub)}
.art{max-width:640px;margin:0 auto;padding:0 18px 60px}
.art .hero{width:calc(100% + 36px);margin:0 -18px;max-height:300px;object-fit:cover;display:block}
.art h2{font-size:22px;line-height:1.45;margin:16px 0 6px}
.art .src{font-size:13px;color:var(--sub);margin-bottom:14px}
.art .body p{font-size:17px;line-height:1.85;margin:0 0 1em}
.note{font-size:14px;color:var(--sub);background:var(--bg);border-radius:10px;padding:10px 12px;margin:4px 0 16px}
.btn{display:block;text-align:center;background:var(--ink);color:#fff;text-decoration:none;border-radius:12px;padding:13px;font-weight:700;margin:18px 0 10px}
.rel{border-top:1px solid var(--line);margin-top:18px;padding-top:10px}
.rel h3{font-size:13px;color:var(--sub);margin:0 0 6px}
.rel a{display:block;color:var(--ink);text-decoration:none;font-size:14.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.rel a small{display:block;color:var(--sub);font-size:12px}
.next{display:block;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:15px;margin-top:22px;color:var(--ink);text-align:left}
.next small{display:block;color:var(--sub);font-size:12px}
.msg{background:var(--card);border-radius:14px;padding:18px;margin-top:20px;font-size:15px}
footer{font-size:12px;color:var(--sub);text-align:center;margin-top:24px}
footer a{color:var(--sub)}
</style>
</head>

<script>
(function(){
  var KEY_NAME = "dailynews_key";   // github.io の他の自作アプリと混ざらない名前
  var P = JSON.parse(document.getElementById("payload").textContent);
  var m = location.hash.match(/k=([A-Za-z0-9_-]+)/);
  try { if (m) { localStorage.setItem(KEY_NAME, m[1]); } } catch (e) {}
  if (m) history.replaceState(null, "", location.pathname);
  var key = m ? m[1] : null;
  if (!key) { try { key = localStorage.getItem(KEY_NAME); } catch (e) {} }

  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function b64(s){ s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function fail(t){ var d = el("div", "msg", t); document.getElementById("list").appendChild(d); }

  if (P.plain) { show(P.plain); return; }
  if (!key) { fail("このページを読むための鍵がこの端末にありません。スマホの ntfy の通知から一度開くと、次からはここからも読めます。"); return; }
  var raw = b64(P.enc);
  crypto.subtle.importKey("raw", b64(key), "AES-GCM", false, ["decrypt"])
    .then(function(k){ return crypto.subtle.decrypt({name: "AES-GCM", iv: raw.slice(0, 12)}, k, raw.slice(12)); })
    .then(function(buf){ show(JSON.parse(new TextDecoder().decode(buf))); })
    .catch(function(){ fail("鍵が合わず開けませんでした。ntfy の新しい通知から開き直してください。"); });

  function show(D){
    var items = D.items, readKey = "dailynews_read_" + D.date, read = {};
    try { read = JSON.parse(localStorage.getItem(readKey) || "{}"); } catch (e) {}
    var chars = 0; items.forEach(function(it){ chars += (it.body ? it.body.join("") : it.desc).length; });
    var d = D.date.split("-");
    document.getElementById("meta").textContent = (+d[1]) + "月" + (+d[2]) + "日（" + D.weekday + "）・" + items.length + "本・約" + Math.max(1, Math.round(chars / 500)) + "分";
    var mk = document.getElementById("market");
    (D.market || []).forEach(function(r){
      var c = el("div", "mk"); c.appendChild(el("b", null, r.name + "（" + r.as_of + "）"));
      var s = el("span", null, r.value); var ch = el("i", r.change[0] === "-" ? "down" : "up", r.change); s.appendChild(ch); c.appendChild(s); mk.appendChild(c);
    });
    var list = document.getElementById("list");
    items.forEach(function(it, i){
      var c = el("div", "card" + (read[i] ? " read" : "")); c.appendChild(el("div", "no", String(i + 1)));
      var t = el("div", "txt"); t.appendChild(el("h2", null, it.title));
      if (it.desc) t.appendChild(el("p", null, it.desc));
      var s = el("div", "src"); if (it.label) s.appendChild(el("span", "chip", it.label)); s.appendChild(document.createTextNode(it.source + " · " + it.time.slice(6)));
      t.appendChild(s); c.appendChild(t);
      if (it.img) { var im = el("img"); im.src = it.img; im.loading = "lazy"; im.referrerPolicy = "no-referrer"; im.alt = ""; im.onerror = function(){ this.remove(); }; c.appendChild(im); }
      c.onclick = function(){ open(i, true); };
      it._card = c; list.appendChild(c);
    });

    var view = document.getElementById("view");
    function open(i, push){
      var it = items[i]; view.innerHTML = "";
      var bar = el("div", "bar"); var back = el("button", null, "‹ 一覧"); back.onclick = function(){ history.back(); };
      bar.appendChild(back); bar.appendChild(el("span", "pos", (i + 1) + " / " + items.length)); bar.appendChild(el("span")); view.appendChild(bar);
      var a = el("div", "art");
      if (it.img) { var im = el("img", "hero"); im.src = it.img; im.referrerPolicy = "no-referrer"; im.alt = ""; im.onerror = function(){ this.remove(); }; a.appendChild(im); }
      a.appendChild(el("h2", null, it.title));
      var s = el("div", "src"); if (it.label) s.appendChild(el("span", "chip", it.label)); s.appendChild(document.createTextNode(it.source + " · " + it.time)); a.appendChild(s);
      var body = el("div", "body");
      if (it.body) { it.body.forEach(function(p){ body.appendChild(el("p", null, p)); }); }
      else { if (it.desc) body.appendChild(el("p", null, it.desc)); a.appendChild(body); body = null;
             a.appendChild(el("div", "note", "このサイトは本文を取り込めないので、続きは元の記事でお読みください。")); }
      if (body) a.appendChild(body);
      var btn = el("a", "btn", it.source + " で元の記事を開く"); btn.href = it.url; btn.target = "_blank"; btn.rel = "noopener noreferrer"; a.appendChild(btn);
      if (it.related && it.related.length) {
        var r = el("div", "rel"); r.appendChild(el("h3", null, "同じ話題のほかの報道"));
        it.related.forEach(function(x){ var l = el("a", null, x.title); l.href = x.url; l.target = "_blank"; l.rel = "noopener noreferrer"; l.appendChild(el("small", null, x.source)); r.appendChild(l); });
        a.appendChild(r);
      }
      if (i + 1 < items.length) { var n = el("button", "next"); n.appendChild(el("small", null, "次の記事 ›")); n.appendChild(document.createTextNode(items[i + 1].title));
        n.onclick = function(){ open(i + 1, false); history.replaceState({a: i + 1}, ""); }; a.appendChild(n); }
      view.appendChild(a); view.classList.add("on"); view.scrollTop = 0; document.body.style.overflow = "hidden";
      read[i] = 1; it._card.classList.add("read"); try { localStorage.setItem(readKey, JSON.stringify(read)); } catch (e) {}
      if (push) history.pushState({a: i}, "");
    }
    window.addEventListener("popstate", function(e){
      if (e.state && e.state.a != null) open(e.state.a, false);
      else { view.classList.remove("on"); document.body.style.overflow = ""; }
    });
  }
})();
</script>
